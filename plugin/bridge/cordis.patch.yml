# Installing/selecting this bundle opens no listener and creates no state.
# The owner starts official login or a tunnel from the plugin; storage initializes automatically.
- insert:
    - id: ds-bot-mobile-bridge
      name: ds-bot-mobile-bridge
      config:
        enabled: false
        host: 127.0.0.1
        port: 0
        allowedOrigins: []
        devAllowInsecure: false
        relay: ''
