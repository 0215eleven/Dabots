name: mobile-release
# Builds the lite phone app for sideloading: an unsigned IPA on macOS, an APK on Linux, and attaches them
# to a GitHub Release. Signing material never lives in the repository; see apps/mobile/README.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (leave empty to only keep workflow artifacts)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true
env:
  APP_DIR: apps/mobile
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm --prefix apps/mobile run typecheck
      - run: npm --prefix apps/mobile test
      - run: npm --prefix packages/mobile-sdk test
      # The Bridge tests import a prepared public DSH / DS Bot fixture (bridge/fixture, not committed).
      - run: npm --prefix bridge run test:prepare
      - run: npm --prefix bridge test

  ios:
    needs: verify
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Only the existing lite variant: no extension or App Group, for free Apple IDs.
        variant: [lite]
    env:
      DS_BOT_NO_WIDGETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm run setup
      - name: Generate the native project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ios --no-install --clean
      - name: Install pods
        working-directory: ${{ env.APP_DIR }}/ios
        run: pod install
      - name: Archive without signing
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Dbotpro.xcworkspace -scheme Dbotpro \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DSBotMobile.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40
      - name: Package the unsigned IPA
        run: |
          set -euo pipefail
          version=$(node -p "require('./${APP_DIR}/app.json').expo.version")
          app=$(find "$RUNNER_TEMP/DSBotMobile.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" artifacts
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          suffix=$([ "${{ matrix.variant }}" = lite ] && echo "-lite" || echo "")
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/artifacts/DSBotMobile-${version}${suffix}-unsigned.ipa" Payload)
          # An unsigned build must carry no signature; fail loudly if a signing identity slipped in.
          if codesign --verify "$app" 2>/dev/null; then echo 'IPA is unexpectedly signed' >&2; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.variant }}
          path: artifacts/*.ipa
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm run setup
      - name: Generate the native project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install --clean
        env:
          DS_BOT_ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Build the release APK (unsigned)
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./${APP_DIR}/app.json').expo.version")
          unsigned=$(ls "$GITHUB_WORKSPACE"/${APP_DIR}/android/app/build/outputs/apk/release/*.apk | head -n 1)
          mkdir -p artifacts
          out="$GITHUB_WORKSPACE/artifacts"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            # Your own key: updates install over earlier builds signed with the same key.
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
            bash "${APP_DIR}/scripts/sign-android.sh" "$unsigned" "$out/DSBotMobile-${version}-android.apk"
          else
            # No secrets (forks, first try): a throwaway key makes the APK installable, but each
            # build has a different signer, so installing a newer build requires uninstalling first.
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ephemeral.jks"
            export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
            export ANDROID_KEY_ALIAS=ds-bot-ci
            keytool -genkeypair -keystore "$ANDROID_KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 3072 \
              -validity 10000 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEYSTORE_PASSWORD" -dname 'CN=DS Bot CI (ephemeral)'
            export ANDROID_SIGNING_CERT_SHA256=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | sed -nE 's/^ *SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
            bash "${APP_DIR}/scripts/sign-android.sh" "$unsigned" "$out/DSBotMobile-${version}-android-selfsigned.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    needs: [ios, android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || inputs.tag != ''
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.ipa *.apk | tee SHA256SUMS.txt
      - name: Attach to the release
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
