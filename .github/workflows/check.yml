name: checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  npm_config_registry: https://registry.npmjs.org
  npm_config_replace_registry_host: never
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm run test:prepare
      - run: npm run check
      - run: git diff --exit-code
      - run: npm --prefix plugin/bridge run test:integration
      - run: npm run check:suite
      - run: npm run pack:plugin
      - run: npm run audit
